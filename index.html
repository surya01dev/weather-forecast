<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Weather</title>
  <!--
  THESIS: A quiet, glanceable forecast that feels like a familiar search result, not a dashboard.
  OWN-WORLD: White paper, graphite text, hairline dividers, warm yellow forecast line, and expressive weather glyphs.
  STORY: Find a place, read the current moment, scan the day curve, then check the week and any active warning.
  FIRST VIEWPORT: Location/search at top, current weather and metrics in one row, hourly curve, then seven days.
  FORM: Compact utility layout inspired by weather-at-a-glance interfaces; the forecast itself is the hero.
  -->
  <style>
    :root { color-scheme: light; --ink:#202124; --muted:#5f6368; --line:#dadce0; --yellow:#fbbc04; --yellow-fill:#fff4c9; --blue:#1967d2; --alert:#c5221f; }
    * { box-sizing: border-box; }
    body { margin:0; background:#fff; color:var(--ink); font:14px/1.4 Arial, Helvetica, sans-serif; }
    main { width:min(100% - 36px, 652px); margin:0 auto; padding:25px 0 40px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .place-line { display:flex; align-items:center; gap:7px; font-size:14px; font-weight:700; }
    .place-line svg { width:17px; height:17px; }
    .place-line button { padding:0; border:0; background:none; color:#185abc; font:inherit; cursor:pointer; }
    .place-line button:hover { text-decoration:underline; }
    .dots { padding:4px; border:0; color:#5f6368; background:none; font-size:20px; line-height:1; cursor:pointer; }
    .search-row { display:flex; gap:7px; margin:13px 0 18px; }
    .search-row input { min-width:0; flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:4px; outline:0; color:var(--ink); background:#fff; font:14px Arial; }
    .search-row input:focus { border-color:#1a73e8; box-shadow:0 0 0 2px rgba(26,115,232,.14); }
    .search-row button { padding:0 15px; border:1px solid #dadce0; border-radius:4px; color:#3c4043; background:#fff; font-weight:700; cursor:pointer; }
    .search-row button:hover { background:#f8f9fa; }
    .status { min-height:18px; margin:-7px 0 7px; color:var(--muted); font-size:12px; }
    .status.error { color:var(--alert); }
    .current { display:grid; grid-template-columns:1fr 1.08fr; align-items:start; gap:22px; }
    .current-main { display:grid; grid-template-columns:auto 1fr; align-items:center; column-gap:14px; }
    .hero-icon { width:64px; height:64px; color:#f9ab00; }
    .hero-icon svg { width:100%; height:100%; }
    .temperature { margin:0; white-space:nowrap; font-size:48px; font-weight:400; line-height:1; letter-spacing:-2px; }
    .temperature sup { margin-left:3px; font-size:18px; letter-spacing:0; vertical-align:top; }
    .metric-line { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .summary { text-align:right; }
    .summary h1 { margin:0; font-size:20px; font-weight:400; }
    .summary p { margin:1px 0; color:var(--muted); font-size:16px; }
    .summary .condition { color:var(--ink); }
    .tabs { display:flex; gap:0; margin-top:17px; border-bottom:1px solid var(--line); }
    .tab { padding:0 15px 8px 0; margin-right:15px; border:0; border-bottom:3px solid transparent; color:#3c4043; background:none; font:14px Arial; cursor:pointer; }
    .tab.active { border-bottom-color:var(--yellow); color:var(--ink); }
    .chart-wrap { margin-top:18px; }
    .chart { width:100%; height:92px; overflow:visible; }
    .chart text { fill:#8a8d91; font-size:11px; }
    .chart .current-label { fill:#3c4043; }
    .hours { display:flex; justify-content:space-between; margin-top:5px; padding:0 5px; color:#5f6368; font-size:12px; }
    .days { display:grid; grid-template-columns:repeat(7, 1fr); margin-top:10px; }
    .day { min-width:0; padding:7px 5px 9px; text-align:center; }
    .day.today { border-radius:10px; background:#f1f3f4; }
    .day-name { font-size:16px; }
    .day-icon { width:35px; height:35px; margin:10px auto 8px; color:#f9ab00; }
    .day-icon svg { width:100%; height:100%; }
    .temps { white-space:nowrap; font-size:12px; }
    .low { margin-left:4px; color:var(--muted); }
    .alert { margin-top:18px; padding-top:24px; border-top:1px solid var(--line); }
    .alert h2 { margin:0; color:var(--alert); font-size:28px; font-weight:400; }
    .alert p { margin:2px 0; color:var(--muted); font-size:16px; }
    .alert .ago { margin-top:6px; font-size:13px; }
    .alert .copy { margin-top:18px; color:#3c4043; font-size:14px; }
    .alert a { display:inline-block; margin-top:17px; color:#681da8; text-decoration:none; font-size:13px; }
    .footer { display:flex; justify-content:flex-end; gap:13px; margin-top:21px; padding-top:8px; border-top:1px solid var(--line); color:#5f6368; font-size:12px; }
    .footer a { color:#5f6368; }
    .signature { position:fixed; right:24px; bottom:18px; display:flex; align-items:center; gap:9px; color:#5f6368; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
    .signature::before { content:""; width:22px; height:1px; background:var(--yellow); box-shadow:7px 3px 0 rgba(251,188,4,.35); }
    .signature strong { display:block; margin-top:2px; color:var(--ink); font:italic 19px/1 "Segoe Print","Bradley Hand",cursive; letter-spacing:-.04em; text-transform:none; }
    @media (max-width:560px) {
      main { width:min(100% - 24px, 652px); padding-top:18px; }
      .current { grid-template-columns:1fr; gap:14px; }
      .summary { text-align:left; padding-left:78px; margin-top:-6px; }
      .days { overflow-x:auto; grid-template-columns:repeat(7, 70px); }
      .day { padding-left:3px; padding-right:3px; }
      .hours { font-size:11px; }
      .signature { right:12px; bottom:10px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <div class="place-line">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="place">Shahjahanpur, Uttar Pradesh</span><span>·</span><button type="button" id="choose">Choose area</button>
      </div>
      <button class="dots" aria-label="More options">⋮</button>
    </div>
    <form class="search-row" id="search-form">
      <input id="city" type="search" placeholder="Search a city" aria-label="Search a city" autocomplete="off">
      <button id="search-button" type="submit">Search</button>
    </form>
    <p class="status" id="status" aria-live="polite"></p>

    <section class="current">
      <div class="current-main">
        <div class="hero-icon" id="hero-icon"></div>
        <div>
          <p class="temperature" id="temperature">--<sup>°C</sup></p>
          <p class="metric-line" id="metrics">Precipitation: --%<br>Humidity: --%<br>Wind: -- km/h</p>
        </div>
      </div>
      <div class="summary">
        <h1>Weather</h1>
        <p id="date-time">Saturday, 8:00 am</p>
        <p class="condition" id="condition">Mostly sunny</p>
      </div>
    </section>

    <nav class="tabs" aria-label="Weather details">
      <button class="tab active" type="button" data-metric="temperature">Temperature</button><button class="tab" type="button" data-metric="precipitation">Precipitation</button><button class="tab" type="button" data-metric="wind">Wind</button>
    </nav>
    <section class="chart-wrap" aria-label="Hourly forecast">
      <svg class="chart" id="chart" viewBox="0 0 650 92" preserveAspectRatio="none"></svg>
      <div class="hours" id="hours"></div>
    </section>
    <section class="days" id="days" aria-label="Seven day forecast"></section>

    <section class="alert">
      <h2>Excessive heat</h2>
      <p id="alert-place">Shahjahanpur, Uttar Pradesh</p>
      <p class="ago">2 hours ago</p>
      <p class="copy">Severe heat is expected in this area.</p>
      <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">More info</a>
    </section>
    <footer class="footer"><a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a><span>•</span><a href="mailto:feedback@example.com">Feedback</a></footer>
  </main>
  <div class="signature" aria-label="Created by Surya Dev Singh"><span>crafted by<strong>Surya Dev Singh</strong></span></div>

  <script>
    const fallback = {
      city:"Shahjahanpur", region:"Uttar Pradesh", country:"India", current:{temperature_2m:30,relative_humidity_2m:75,wind_speed_10m:21,weather_code:1},
      hourly:{time:["09:00","12:00","15:00","18:00","21:00","00:00","03:00","06:00"],temperature_2m:[30,33,33,32,29,28,28,27],precipitation_probability:[0,5,10,15,20,5,0,0],wind_speed_10m:[18,21,24,22,19,16,14,12]},
      daily:{time:["2026-09-12","2026-09-13","2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18"],weather_code:[95,2,3,95,2,0,0],temperature_2m_max:[33,33,32,29,31,33,33],temperature_2m_min:[27,26,26,25,26,26,25]}
    };
    const icons = {
      sun:'<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="9" fill="currentColor"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M38.1 9.9l-4.2 4.2M14.1 33.9l-4.2 4.2"/></g></svg>',
      partly:'<svg viewBox="0 0 48 48" fill="none"><circle cx="20" cy="19" r="9" fill="#f9ab00"/><g stroke="#f9ab00" stroke-width="2.4" stroke-linecap="round"><path d="M20 5v4M6 19h4M10 9l3 3M30 9l-3 3"/></g><path d="M15 38h20a7 7 0 0 0 1-13.9A11 11 0 0 0 15 22a8 8 0 0 0 0 16Z" fill="#d9dce1" stroke="#b7bbc0" stroke-width="1.5"/></svg>',
      cloud:'<svg viewBox="0 0 48 48" fill="none"><path d="M12 37h24a8.5 8.5 0 0 0 1-16.9A13 13 0 0 0 12 20a8.5 8.5 0 0 0 0 17Z" fill="#c8cdd2"/></svg>',
      storm:'<svg viewBox="0 0 48 48" fill="none"><path d="M12 30h24a8.5 8.5 0 0 0 1-16.9A13 13 0 0 0 12 13a8.5 8.5 0 0 0 0 17Z" fill="#c8cdd2"/><path d="m27 25-7 11h6l-3 8 9-13h-6l5-6" fill="#f57c00"/></svg>'
    };
    const descriptions={0:"Sunny",1:"Mostly sunny",2:"Partly cloudy",3:"Cloudy",45:"Misty",48:"Misty",51:"Light drizzle",53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorms",96:"Thunderstorms",99:"Thunderstorms"};
    function iconFor(code){return code>=95?icons.storm:code===0?icons.sun:code===1||code===2?icons.partly:code===3?icons.cloud:icons.storm}
    function renderChart(metric, data) {
      const values = data.hourly[metric] || fallback.hourly[metric];
      const times = data.hourly.time || fallback.hourly.time;
      const min = Math.min(...values) - 2;
      const max = Math.max(...values) + 2;
      const points = values.map((v, i) => `${i * (650 / (values.length - 1))},${75 - (v - min) / (max - min) * 58}`).join(" ");
      const labels = values.map((v, i) => `<text class="${i===0?"current-label":""}" x="${i * (650 / (values.length - 1))}" y="${76 - (v - min) / (max - min) * 58 - 7}" text-anchor="${i===0?"start":i===values.length-1?"end":"middle"}">${metric === 'precipitation_probability' ? v + '%' : Math.round(v)}</text>`).join("");
      const color = metric === 'precipitation_probability' ? '#4285f4' : metric === 'wind_speed_10m' ? '#34a853' : '#fbbc04';
      const fillColor = metric === 'precipitation_probability' ? '#e3f2fd' : metric === 'wind_speed_10m' ? '#e6f4ea' : '#fff4c9';
      document.getElementById("chart").innerHTML = `<polygon points="0,78 ${points} 650,78" fill="${fillColor}"/><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>${labels}`;
      document.getElementById("hours").innerHTML = times.map(t => `<span>${String(t).slice(0, 5).replace(":00", "")} ${String(t).slice(0, 2) >= 12 ? "pm" : "am"}</span>`).join("");
    }
    function render(data, sample=false){
      const location = [data.city, data.region || data.country].filter(Boolean).join(", ");
      document.getElementById("place").textContent=location; document.getElementById("alert-place").textContent=location;
      document.getElementById("temperature").innerHTML=`${Math.round(data.current.temperature_2m)}<sup>°C</sup>`;
      document.getElementById("metrics").innerHTML=`Precipitation: ${sample?4:"--"}%<br>Humidity: ${Math.round(data.current.relative_humidity_2m)}%<br>Wind: ${Math.round(data.current.wind_speed_10m)} km/h`;
      document.getElementById("condition").textContent=descriptions[data.current.weather_code]||"Variable conditions"; document.getElementById("hero-icon").innerHTML=iconFor(data.current.weather_code);
      renderChart('temperature_2m', data);
      document.getElementById("days").innerHTML=data.daily.time.map((date,i)=>`<article class="day ${i===0?"today":""}"><div class="day-name">${new Date(`${date}T12:00:00`).toLocaleDateString(undefined,{weekday:"short"})}</div><div class="day-icon">${iconFor(data.daily.weather_code[i])}</div><div class="temps"><span>${Math.round(data.daily.temperature_2m_max[i])}°</span><span class="low">${Math.round(data.daily.temperature_2m_min[i])}°</span></div></article>`).join("");
      document.getElementById("date-time").textContent=`${new Date().toLocaleDateString(undefined,{weekday:"long"})}, ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`;
    }
    async function loadWeather(city="Shahjahanpur"){
      const status=document.getElementById("status"),button=document.getElementById("search-button"); status.className="status"; status.textContent="Updating forecast…"; button.disabled=true;
      try{
        const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`); if(!geo.ok) throw Error();
        const place=(await geo.json()).results?.[0]; if(!place) throw Error();
        const response=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation_probability,weather_code&hourly=temperature_2m,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=7&timezone=auto`); if(!response.ok) throw Error();
        const weather=await response.json(); const start=Math.max(0,weather.hourly.time.findIndex(t=>new Date(t)>=new Date())); const hourly={time:weather.hourly.time.slice(start,start+8).map(t=>t.split("T")[1]),temperature_2m:weather.hourly.temperature_2m.slice(start,start+8),precipitation_probability:weather.hourly.precipitation_probability.slice(start,start+8),wind_speed_10m:weather.hourly.wind_speed_10m.slice(start,start+8)};
        const weatherData = {city:place.name,region:place.admin1,country:place.country,current:weather.current,hourly,daily:weather.daily};
        window.currentWeatherData = weatherData;
        render(weatherData); status.textContent="";
      }catch(e){render(fallback,true);status.className="status error";status.textContent="Live data unavailable — showing a sample forecast."}finally{button.disabled=false}
    }
    window.currentWeatherData = null;
    document.getElementById("search-form").addEventListener("submit",e=>{e.preventDefault();const city=document.getElementById("city").value.trim();if(city)loadWeather(city)});
    document.getElementById("choose").addEventListener("click",()=>document.getElementById("city").focus());
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        const metric = e.target.dataset.metric === 'temperature' ? 'temperature_2m' : e.target.dataset.metric === 'precipitation' ? 'precipitation_probability' : 'wind_speed_10m';
        const currentData = window.currentWeatherData || {hourly:fallback.hourly};
        renderChart(metric, currentData);
      });
    });
    render(fallback,true); loadWeather();
  </script>
</body>
</html>
